name: Changelog Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md updated
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated. ✅"
          else
            echo "::error::CHANGELOG.md was not updated. Add an entry under [Unreleased], or apply the 'skip-changelog' label if this change doesn't need one (e.g. CI-only, typo fixes)."
            exit 1
          fi
