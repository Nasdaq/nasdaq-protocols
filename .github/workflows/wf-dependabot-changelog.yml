name: Dependabot changelog entry

# Runs with normal (write) permissions even for bot-authored PRs, unlike the
# `pull_request` event which gives Dependabot-triggered runs a read-only token.
# This job only reads the PR title (trusted metadata) and never checks out or
# executes the PR's code, so it's safe to use pull_request_target here.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  add-changelog-entry:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add CHANGELOG entry from PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - << 'EOF'
          import os
          import re

          pr_title = os.environ["PR_TITLE"]
          pr_number = os.environ["PR_NUMBER"]
          marker = f"(#{pr_number})"

          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()

          if marker in changelog:
              print("Entry already present, skipping.")
              raise SystemExit(0)

          m = re.match(r"^Bump (\S+) from (\S+) to (\S+)", pr_title)
          if m:
              dep, old, new = m.groups()
              entry = f"- Chore: bump `{dep}` from {old} to {new} {marker}"
          else:
              entry = f"- Chore: {pr_title} {marker}"

          anchor = "## [Unreleased]\n\nNo changes yet.\n"
          if anchor in changelog:
              changelog = changelog.replace(anchor, f"## [Unreleased]\n\n{entry}\n")
          else:
              changelog = changelog.replace(
                  "## [Unreleased]\n", f"## [Unreleased]\n\n{entry}\n", 1
              )

          with open("CHANGELOG.md", "w", encoding="utf-8") as f:
              f.write(changelog)
          EOF

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add CHANGELOG entry for #${{ github.event.pull_request.number }}"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
